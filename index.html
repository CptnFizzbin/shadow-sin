<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="/favicon.svg" rel="icon" type="image/x-icon" />

  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <title>ShadowSIN 4e</title>

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&family=Monda:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <script>
    // Handle GitHub Pages redirects from 404.html
    const redirect = sessionStorage.getItem("redirect");
    if (redirect) {
      sessionStorage.removeItem("redirect");
      window.history.replaceState(null, null, redirect);
    }
  </script>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
