name: CI

on:
  push:
    branches:
      - shadowrun-4e
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Run lint and format check
        run: yarn lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Run unit tests
        run: yarn test:coverage

      - id: upload-report
        name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/coverage-summary.json
          retention-days: 90

  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-workspace

      - name: Build (with fixture seeding for e2e)
        run: yarn build
        env:
          VITE_SEED_FIXTURES: true

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: yarn test:e2e

      - id: upload-report
        name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs:
      - unit-tests
    steps:
      - uses: ./.github/actions/setup-workspace

      - id: base-coverage
        name: Find base branch coverage artifact
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const baseSha = context.payload.pull_request.base.sha;
            const baseRef = context.payload.pull_request.base.ref;

            // Search recent successful coverage runs on the base branch
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: baseRef,
              status: 'success',
              per_page: 10,
            });

            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              const coverageArtifact = artifacts.data.artifacts.find(
                (a) => a.name.startsWith('coverage-')
              );

              if (coverageArtifact) {
                core.setOutput('artifact-id', coverageArtifact.id);
                core.setOutput('found', 'true');
                console.log(`Found base coverage artifact: ${coverageArtifact.name} (id=${coverageArtifact.id})`);
                return;
              }
            }

            console.log('No base coverage artifact found; skipping comparison.');
            core.setOutput('found', 'false');

      - name: Download base branch coverage artifact
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.base-coverage.outputs.artifact-id }}
          path: coverage-base/

      - name: Download base branch coverage artifact
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.unit-tests.upload-report.outputs.artifact-id }}
          path: coverage/

      - name: Compare coverage against base branch
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.found == 'true'
        run: |
          node .github/scripts/check-coverage.mjs \
            coverage-base/coverage-summary.json \
            coverage/coverage-summary.json

