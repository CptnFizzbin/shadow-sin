name: CI

on:
  push:
    branches:
      - shadowrun-4e
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint and format check
        run: yarn lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run unit tests
        run: yarn test

  e2e-tests:
    name: End-to-End Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/coverage-summary.json
          retention-days: 90

      - name: Find base branch coverage artifact
        if: github.event_name == 'pull_request'
        id: base-coverage
        uses: actions/github-script@v7
        with:
          script: |
            const baseSha = context.payload.pull_request.base.sha;
            const baseRef = context.payload.pull_request.base.ref;

            // Search recent successful coverage runs on the base branch
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: baseRef,
              status: 'success',
              per_page: 10,
            });

            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              const coverageArtifact = artifacts.data.artifacts.find(
                (a) => a.name.startsWith('coverage-')
              );

              if (coverageArtifact) {
                core.setOutput('artifact-id', coverageArtifact.id);
                core.setOutput('found', 'true');
                console.log(`Found base coverage artifact: ${coverageArtifact.name} (id=${coverageArtifact.id})`);
                return;
              }
            }

            console.log('No base coverage artifact found; skipping comparison.');
            core.setOutput('found', 'false');

      - name: Download base branch coverage artifact
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-id: ${{ steps.base-coverage.outputs.artifact-id }}
          path: coverage-base/

      - name: Compare coverage against base branch
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.found == 'true'
        run: |
          node .github/scripts/check-coverage.mjs \
            coverage-base/coverage-summary.json \
            coverage/coverage-summary.json

